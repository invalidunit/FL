name: Build Filza Lite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          elif [ -d "/Applications/Xcode_15.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen || true

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build for Device
        run: |
          xcodebuild \
            -project FilzaLite.xcodeproj \
            -scheme FilzaLite \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $PWD/build/FilzaLite.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP=$(find build/FilzaLite.xcarchive/Products/Applications -name "*.app" | head -1)
          echo "Found app: $APP"
          cp -R "$APP" Payload/
          zip -r FilzaLite.ipa Payload
          ls -lh FilzaLite.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FilzaLite-IPA
          path: FilzaLite.ipa
          retention-days: 30
          if-no-files-found: error
