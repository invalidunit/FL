name: FilzaLite
options:
  projectFormat: xcode15_0
  deploymentTarget:
    iOS: "15.0"
  bundleIdPrefix: com.nan
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    PRODUCT_BUNDLE_IDENTIFIER: com.nan.filzalite
    INFOPLIST_KEY_CFBundleDisplayName: Filza Lite
    INFOPLIST_KEY_CFBundleDevelopmentRegion: en
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
targets:
  FilzaLite:
    type: application
    platform: iOS
    sources:
      - path: Sources/FilzaLite
    settings:
      base:
        INFOPLIST_FILE: Sources/FilzaLite/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/FilzaLite/FilzaLite.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.nan.filzalite
        IPHONEOS_DEPLOYMENT_TARGET: 15.0
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
schemes:
  FilzaLite:
    build:
      targets:
        FilzaLite: all
    run:
      config: Debug
postGenCommand: |
  ruby -e '
    require "xcodeproj"
    path = "FilzaLite.xcodeproj"
    proj = Xcodeproj::Project.open(path)
    proj.object_version = "60"
    proj.save
  '
