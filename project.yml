name: FilzaLite
options:
  bundleIdPrefix: com.nan
  deploymentTarget:
    iOS: "15.0"
  projectFormat: xcode15_0
  xcodeVersion: "15.0"
  postGenCommand: sed -i.bak -E 's|objectVersion = [0-9]+|objectVersion = 60|' FilzaLite.xcodeproj/project.pbxproj && rm -f FilzaLite.xcodeproj/project.pbxproj.bak
targets:
  FilzaLite:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - Sources/FilzaLite
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nan.FilzaLite
      PRODUCT_NAME: Filza Lite
      INFOPLIST_KEY_CFBundleDisplayName: Filza Lite
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
      GENERATE_INFOPLIST_FILE: YES
      MARKETING_VERSION: 1.0
      CURRENT_PROJECT_VERSION: 1
      IPHONEOS_DEPLOYMENT_TARGET: 15.0